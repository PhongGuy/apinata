[package]
name = "apinata-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace root, so cargo never walks up into an enclosing checkout.
[workspace]

[dependencies]
apinata-app = { path = "../../crates/apinata-app" }
apinata-core = { path = "../../crates/apinata-core" }
gpui-kit = "=0.9.0"
gpui-pilot-host = { git = "https://github.com/PhongGuy/gpui-pilot", tag = "v0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
toml = "1"
tempfile = "3"

# Build the app's dependencies optimised, as the root workspace does.
[profile.dev.package."*"]
opt-level = 1
