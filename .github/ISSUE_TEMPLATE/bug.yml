name: Bug
description: Something is broken or gives a wrong result.
title: "Bug: "
labels: [bug]
assignees: [PhongGuy]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove tokens, passwords and other secrets from anything you paste.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Desktop app
        - CLI (apinata)
        - MCP server
        - Opening or saving a collection
        - Importing or exporting
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the collection ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `apinata --version` or the app's About dialog.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Request or collection file
      description: The smallest YAML file that shows the problem, with secrets removed.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
