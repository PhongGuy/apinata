# The gate on every push to master and every pull request; the Windows check cross-compiles
# here. Each step is a make target, so a local `make check` runs the same.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_clippy:
        description: Also lint the workspace on macOS (bills at ten times Linux)
        type: boolean
        default: false
      windows_tests:
        description: Also run the core git stop tests on Windows (bills at twice Linux)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state would overflow the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1

jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        # The hosted runner leaves about 14 GB free; these preinstalled toolchains are unused.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The mirror can serve debs at dial-up speed, so they are cached under a hash of apt's
      # install plan: a new package or version misses, and a near miss restores the rest.
      - name: Plan build dependencies
        id: apt-plan
        timeout-minutes: 5
        run: |
          sudo apt-get update
          prefix="apt-debs-$ImageOS-$RUNNER_ARCH-"
          plan=$(apt-get install -s --no-install-recommends $LINUX_BUILD_DEPS gcc-mingw-w64-x86-64 | { grep '^Inst ' || true; } | sha256sum | cut -c1-16)
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$plan" >> "$GITHUB_OUTPUT"
      - name: Restore cached build dependencies
        id: apt-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-plan.outputs.key }}
          restore-keys: ${{ steps.apt-plan.outputs.prefix }}
      # apt writes each finished deb straight into the cached directory, so a slow mirror
      # that times out this step still leaves its progress for the save below.
      - name: Download build dependencies
        id: apt-download
        timeout-minutes: 20
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          mkdir -p "$DEBS/partial"
          sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$DEBS" $LINUX_BUILD_DEPS gcc-mingw-w64-x86-64
      - name: Install build dependencies
        timeout-minutes: 10
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$DEBS" $LINUX_BUILD_DEPS gcc-mingw-w64-x86-64
      # The cache action tars as the runner user, so apt's root-owned lock and half-fetched
      # files go and the rest changes hands.
      - name: Prepare build dependencies for saving
        if: always() && github.event_name == 'push' && steps.apt-restore.outputs.cache-hit != 'true' && steps.apt-plan.outcome == 'success'
        timeout-minutes: 2
        env:
          DEBS: ${{ runner.temp }}/apt-debs
        run: |
          mkdir -p "$DEBS"
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chown -R "$(id -u):$(id -g)" "$DEBS"
      # Only master writes the cache, so a pull request can read it but never poison it. An
      # unfinished download saves under a partial key that the restore prefix picks up next
      # run, so an exact hit always means every deb is there.
      - name: Save build dependencies
        if: always() && github.event_name == 'push' && steps.apt-restore.outputs.cache-hit != 'true' && steps.apt-plan.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-download.outcome == 'success' && steps.apt-plan.outputs.key || format('{0}partial-{1}-{2}', steps.apt-plan.outputs.prefix, github.run_id, github.run_attempt) }}
      - name: Gate
        timeout-minutes: 50
        run: make check icons-check windows-check workflows-lint

  # Audits every workflow for injection, credential and pinning mistakes.
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false

  # The macOS-only code (keychain, trash, git) is otherwise compiled only by release builds.
  macos-clippy:
    if: inputs.macos_clippy
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -Dwarnings

  # The Windows git stop can only be proven on a real Windows machine.
  windows-tests:
    if: inputs.windows_tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: "cargo test -p apinata-core --locked --lib git::run::"
      - run: "cargo test -p apinata-core --locked --test integration git_commit::windows_stop::"
