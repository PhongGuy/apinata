info:
  name: ntlm
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/ntlm
  auth:
    type: ntlm
    username: alice
    password: "{{ntlmPassword}}"
    domain: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
