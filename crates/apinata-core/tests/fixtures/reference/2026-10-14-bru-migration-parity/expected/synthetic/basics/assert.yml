info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com/assert

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items length
      operator: gt
      value: "2"
    - expression: res.headers['content-type']
      operator: contains
      value: json
      disabled: true
    - expression: res.body.name with spaces
      operator: neq
      value: '  "x"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
