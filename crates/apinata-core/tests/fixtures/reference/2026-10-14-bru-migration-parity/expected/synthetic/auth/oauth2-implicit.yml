info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://example.com/auth
    callbackUrl: https://example.com/cb
    credentials:
      clientId: cid
    scope: openid
    state: s
    tokenConfig:
      id: credentials
      placement:
        header: ""
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
