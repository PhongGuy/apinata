info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com/headers
  headers:
    - name: content-type
      value: application/json
    - name: x-disabled
      value: off
      disabled: true
    - name: x-quoted:key "inner"
      value: quoted value
    - name: x-disabled-quoted
      value: dq
      disabled: true
    - name: x-empty
      value: ""
    - name: ""
      value: no key
    - name: x-colon-value
      value: "a: b: c"
    - name: x-spaced
      value: padded value

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
