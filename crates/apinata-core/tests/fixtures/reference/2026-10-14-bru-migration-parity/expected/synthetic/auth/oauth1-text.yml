info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com
  auth:
    type: oauth1
    consumerKey: ck
    consumerSecret: cs
    accessToken: at
    accessTokenSecret: ts
    callbackUrl: https://example.com/cb
    verifier: v
    signatureMethod: HMAC-SHA1
    privateKey:
      type: text
      value: plain-key
    timestamp: ""
    nonce: n
    version: "1.0"
    realm: r
    placement: header
    includeBodyHash: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
