    request:
      url: https://api.example.com/items?page=1
      method: get
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""
  - name: Second renamed
    request:
      url: ""
      method: get
      headers:
        - name: c
          value: "3"
        - name: b
          value: "2"
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""

