info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://example.com/token
    credentials:
      placement: body
    tokenConfig:
      id: credentials
      placement:
        header: ""
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
