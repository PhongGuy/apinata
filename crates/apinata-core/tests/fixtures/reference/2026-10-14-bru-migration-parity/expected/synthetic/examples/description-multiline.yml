info:
  name: Multiline description
  type: http
  seq: 2

http:
  method: GET
  url: https://api.example.com/items

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Documented
    description: |-
      First line of the description
        indented second line
      third line
    request:
      url: ""
      method: get
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""
  - name: Typed description
    description: |-
      Body text
       @contentType(text/markdown)
    request:
      url: ""
      method: get
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""
