info:
  name: Untitled Request
  type: http

http:
  method: GET
  url: https://example.com
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://example.com/token
    refreshTokenUrl: https://example.com/refresh
    credentials:
      clientId: cid
      clientSecret: csecret
      placement: basic_auth_header
    resourceOwner:
      username: alice
      password: secret
    scope: read write
    tokenConfig:
      id: creds
      placement:
        query: tok
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
