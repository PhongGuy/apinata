info:
  name: clear
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome
    - name: della
      value: is-beautiful

runtime:
  scripts:
    - type: before-request
      code: req.headerList.clear();
    - type: tests
      code: |-
        test("req.headerList.clear() removes user-defined headers", function() {
          expect(req.headerList.has('bruno')).to.be.false;
          expect(req.headerList.has('della')).to.be.false;
          expect(req.getHeaders()['bruno']).to.be.undefined;
          expect(req.getHeaders()['della']).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
