info:
  name: assimilate
  type: http
  seq: 9

http:
  method: GET
  url: "{{host}}/ping"
  headers:
    - name: bruno
      value: is-awesome

runtime:
  scripts:
    - type: before-request
      code: |-
        req.headerList.assimilate([
          { key: 'x-merged', value: 'merged-value' }
        ]);
    - type: tests
      code: |-
        test("req.headerList.assimilate(source) - merges without removing existing", function() {
          expect(req.getHeader('bruno')).to.equal('is-awesome');
          expect(req.getHeader('x-merged')).to.equal('merged-value');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: pong

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
