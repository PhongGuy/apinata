info:
  name: Test API
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/test

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Example 1
    description: First example
    request:
      url: https://api.example.com/example1
      method: get
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""
  - name: Example 2
    description: Second example with JSON body
    request:
      url: https://api.example.com/example2
      method: get
      body:
        type: json
        data: |-
          {
            "data": "test"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: ""
