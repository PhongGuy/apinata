info:
  name: OAuth2 Examples API
  type: http
  seq: 1

http:
  method: POST
  url: https://api.example.com/oauth/protected
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "action": "test",
        "data": {
          "message": "Protected resource access"
        }
      }
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://oauth.example.com/authorize
    accessTokenUrl: https://oauth.example.com/token
    refreshTokenUrl: https://oauth.example.com/token
    callbackUrl: https://api.example.com/oauth/callback
    credentials:
      clientId: my-client-id
      clientSecret: my-client-secret
      placement: header
    scope: read write
    pkce: {}
    tokenConfig:
      id: authorization
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

runtime:
  variables:
    - name: oauth_state
      value: "{{$uuid}}"
    - name: client_scopes
      value: read,write,admin
  scripts:
    - type: before-request
      code: |-
        const state = crypto.randomBytes(16).toString('hex');
        bru.setVar('oauth_state', state);
        bru.setVar('timestamp', Date.now());
    - type: tests
      code: |-
        test("Response should be 200", function() {
          expect(res.getStatus()).to.eql(200);
        });

        test("Should have user data in response", function() {
          const body = res.getBody();
          expect(body.access_token).to.be.ok;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: OAuth2 Protected Resource
    description: Example accessing resource protected with OAuth2 authorization code flow
    request:
      url: https://api.example.com/oauth/protected
      method: post
      headers:
        - name: authorization
          value: '"Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9",'
        - name: content-type
          value: '"application/json"'
      body:
        type: json
        data: |-
          {
            "action": "fetch",
            "resource": "user_profile"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "user": {
              "id": "123",
              "name": "John Doe",
              "email": "john@example.com",
              "scopes": ["read", "write"]
            },
            "token": {
              "access_token": "access_token_abc123",
              "expires_in": 3600,
              "token_type": "Bearer"
            }
          }
  - name: OAuth2 Token Refresh
    description: Example demonstrating OAuth2 token refresh flow
    request:
      url: https://api.example.com/oauth/token
      method: post
      headers:
        - name: content-type
          value: '"application/json",'
        - name: accept
          value: '"application/json"'
      body:
        type: json
        data: |-
          {
            "grant_type": "refresh_token",
            "refresh_token": "refresh_token_xyz789",
            "client_id": "my-client-id",
            "client_secret": "my-client-secret"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "new_access_token_def456",
            "refresh_token": "new_refresh_token_abc789",
            "expires_in": 3600,
            "token_type": "Bearer",
            "scope": "read write"
          }
  - name: OAuth2 Client Credentials
    description: Example using OAuth2 client credentials grant type
    request:
      url: https://api.example.com/oauth/client-credentials
      method: post
      headers:
        - name: content-type
          value: '"application/json"'
      body:
        type: json
        data: |-
          {
            "grant_type": "client_credentials",
            "client_id": "service-account",
            "client_secret": "service-secret-key",
            "scope": "admin"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "service_access_token_123",
            "expires_in": 7200,
            "token_type": "Bearer",
            "scope": "admin"
          }
  - name: OAuth2 Password Grant
    description: Example using OAuth2 password grant (username/password)
    request:
      url: https://api.example.com/oauth/password
      method: post
      headers:
        - name: content-type
          value: '"application/json"'
      body:
        type: json
        data: |-
          {
            "grant_type": "password",
            "username": "user@example.com",
            "password": "SecurePass123!",
            "client_id": "mobile-app",
            "client_secret": "mobile-app-secret"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "access_token": "user_access_token_456",
            "refresh_token": "user_refresh_token_789",
            "expires_in": 3600,
            "token_type": "Bearer"
          }

docs: |-
  This collection demonstrates OAuth2 authentication flows.
  Supports authorization code, client credentials, and password grant types.
  Examples show token refresh and protected resource access.
