info:
  name: Test API
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/test

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Example with Response
    description: An example with response data
    request:
      url: https://api.example.com/users/123
      method: get
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 123,
            "name": "John Doe"
          }
