info:
  name: Complex API with Auth
  type: http
  seq: 1

http:
  method: POST
  url: https://api.example.com/users
  headers:
    - name: content-type
      value: application/json
    - name: x-api-key
      value: my-secret-key
    - name: x-request-id
      value: "{{$uuid}}"
  params:
    - name: include
      value: details
      type: query
    - name: format
      value: json
      type: query
    - name: id
      value: "123"
      type: path
    - name: status
      value: active
      type: path
  body:
    type: json
    data: |-
      {
        "username": "johndoe",
        "email": "john@example.com",
        "profile": {
          "firstName": "John",
          "lastName": "Doe",
          "age": 30
        },
        "preferences": {
          "theme": "dark",
          "notifications": true
        },
        "tags": ["admin", "user", "verified"]
      }
  auth:
    type: bearer
    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHluKJe2vncyz4h4SH6FSS7YOKIx

runtime:
  variables:
    - name: user_id
      value: "12345"
    - name: environment
      value: production
  scripts:
    - type: before-request
      code: |-
        const timestamp = Date.now();
        bru.setVar("request_timestamp", timestamp);
        bru.setVar("signature", crypto.createHash('md5').update(timestamp.toString()).digest('hex'));
    - type: tests
      code: |-
        test("Response should be 201", function() {
          expect(res.getStatus()).to.eql(201);
        });

        test("Response should have user data", function() {
          const body = res.getBody();
          expect(body.username).to.be.ok;
          expect(body.email).to.be.ok;
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: "{{res.id}}"
        method: jsonq
      variable:
        name: response_id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: "{{$timestamp}}"
        method: jsonq
      variable:
        name: processed_at
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: Basic User Creation
    description: Creates a new user with minimal required fields
    request:
      url: https://api.example.com/users
      method: post
      headers:
        - name: authorization
          value: '"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9",'
        - name: content-type
          value: '"application/json"'
      body:
        type: json
        data: |-
          {
            "username": "newuser",
            "email": "newuser@example.com",
            "password": "SecurePass123!"
          }
    response:
      status: 201
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": 100,
            "username": "newuser",
            "email": "newuser@example.com",
            "created_at": "2024-01-15T10:30:00Z",
            "status": "active"
          }
  - name: Advanced User with Profile
    description: Creates a user with complete profile information and nested data
    request:
      url: https://api.example.com/users
      method: post
      headers:
        - name: authorization
          value: '"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9",'
        - name: content-type
          value: '"application/json",'
        - name: x-api-key
          value: '"advanced-api-key-45678"'
      body:
        type: json
        data: |-
          {
            "username": "developer",
            "email": "dev@example.com",
            "password": "DevPass2024!",
            "profile": {
              "firstName": "Jane",
              "lastName": "Developer",
              "bio": "Software engineer passionate about APIs",
              "location": {
                "city": "San Francisco",
                "country": "USA",
                "timezone": "America/Los_Angeles"
              },
              "social": {
                "github": "jandeveloper",
                "twitter": "@jane_dev"
              }
            },
            "skills": ["JavaScript", "Node.js", "React", "API Design"],
            "experience": 5,
            "preferences": {
              "theme": "dark",
              "language": "en",
              "notifications": {
                "email": true,
                "push": true,
                "sms": false
              }
            }
          }
    response:
      status: 201
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": 101,
            "username": "developer",
            "email": "dev@example.com",
            "profile": {
              "firstName": "Jane",
              "lastName": "Developer",
              "bio": "Software engineer passionate about APIs",
              "location": {
                "city": "San Francisco",
                "country": "USA",
                "timezone": "America/Los_Angeles"
              }
            },
            "skills": ["JavaScript", "Node.js", "React", "API Design"],
            "experience": 5,
            "created_at": "2024-01-15T12:45:30Z",
            "status": "active",
            "verified": false
          }
  - name: XML Data Example
    description: Example with XML format and complex structure
    request:
      url: https://api.example.com/users/xml
      method: post
      headers:
        - name: content-type
          value: '"application/xml",'
        - name: authorization
          value: '"Basic YWRtaW46cGFzc3dvcmQ="'
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <user>
            <username>xmluser</username>
            <email>xml@example.com</email>
            <profile>
              <firstName>XML</firstName>
              <lastName>User</lastName>
            </profile>
          </user>
    response:
      status: 201
      statusText: OK
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <response>
            <id>102</id>
            <status>created</status>
            <user>
              <username>xmluser</username>
              <email>xml@example.com</email>
            </user>
          </response>

docs: |-
  This endpoint creates a new user account.
  Requires authentication via Bearer token or API key.
  Supports nested JSON structures with arrays.
