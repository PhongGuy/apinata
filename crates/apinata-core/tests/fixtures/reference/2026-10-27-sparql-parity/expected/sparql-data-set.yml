info:
  name: query people
  type: http
  seq: 2

http:
  method: POST
  url: "{{endpoint}}/sparql"
  headers:
    - name: Accept
      value: application/sparql-results+json
  body:
    type: sparql
    data: |-
      SELECT ?s WHERE {
        ?s a <{{type}}> .
      }
      LIMIT 10

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
