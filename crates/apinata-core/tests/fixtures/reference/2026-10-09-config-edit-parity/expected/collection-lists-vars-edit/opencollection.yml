opencollection: 1.0.0

info:
  name: bruno-yml-testbench
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: coll_str
      value: changed
    - name: coll_num
      value:
        type: number
        data: "100"
    - name: coll_bool
      value:
        type: boolean
        data: "false"
    - name: coll_obj
      value:
        type: object
        data: |-
          {
            "scope": "collection"
          }
bundled: false
extensions: {}
