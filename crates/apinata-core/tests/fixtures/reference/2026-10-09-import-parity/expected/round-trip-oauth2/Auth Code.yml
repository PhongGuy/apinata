info:
  name: Auth Code
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/health
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://api.example.com/authorize
    accessTokenUrl: https://api.example.com/access
    refreshTokenUrl: https://api.example.com/refresh
    callbackUrl: https://api.example.com/callback
    credentials:
      clientId: "{{client_id}}"
      clientSecret: "{{client_secret}}"
      placement: basic_auth_header
    additionalParameters:
      authorizationRequest:
        - name: authKey
          placement: query
          value: authValue
      accessTokenRequest:
        - name: tokenKey
          placement: body
          value: tokenValue
        - name: tokenKey1
          placement: query
          value: tokenValue1
        - name: tokenKey2
          placement: header
          value: tokenValue2
      refreshTokenRequest:
        - name: refreshKey
          placement: body
          value: refreshValue
        - name: refreshKey1
          placement: query
          value: refreshValue1
        - name: refreshKey2
          placement: header
          value: refreshValue2
    scope: scope:scope1,scope:scope2
    state: customState
    pkce:
      disabled: true
    tokenConfig:
      id: cc-tname
      placement:
        query: access_token
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
