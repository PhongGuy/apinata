info:
  name: password
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/health
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: https://api.example.com/access
    refreshTokenUrl: https://api.example.com/refresh
    credentials:
      clientId: "{{client_id}}"
      clientSecret: "{{client_secret}}"
      placement: body
    resourceOwner:
      username: "{{username}}"
      password: "{{password}}"
    scope: scope:scope1,scope:scope2
    additionalParameters:
      accessTokenRequest:
        - name: tokenKey
          placement: body
          value: tokenValue
        - name: tokenKey1
          placement: query
          value: tokenValue1
        - name: tokenKey2
          placement: header
          value: tokenValue2
      refreshTokenRequest:
        - name: refreshKey
          placement: body
          value: refreshValue
        - name: refreshKey1
          placement: query
          value: refreshValue1
        - name: refreshKey2
          placement: header
          value: refreshValue2
    tokenConfig:
      id: cc-tname
      placement:
        header: CustomBearer
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
