info:
  name: Implicit
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/health
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/authorize
    callbackUrl: https://api.example.com/callback
    credentials:
      clientId: "{{client_id}}"
    scope: scope:scope1,scope:scope2
    state: customState
    additionalParameters:
      authorizationRequest:
        - name: authKey
          placement: query
          value: authValue
    tokenConfig:
      id: cc-tname
      placement:
        header: CustomBearer
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
