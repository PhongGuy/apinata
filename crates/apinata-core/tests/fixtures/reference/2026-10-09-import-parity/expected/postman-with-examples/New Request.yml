info:
  name: New Request
  type: http
  seq: 1

http:
  method: GET
  url: https://testbench-sanity.usebruno.com/ping
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success Response
    request:
      url: https://testbench-sanity.usebruno.com/ping
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: x-powered-by
          value: Express
      body:
        type: json
        data: |-
          {
              "ping": "pong"
          }
  - name: Error Response
    request:
      url: https://testbench-sanity.usebruno.com/ping
      method: GET
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "ping": "pong"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "error": "Internal Server Error"
          }
