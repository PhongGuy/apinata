info:
  name: OAuth2 Token in Header
  type: http
  seq: 1

http:
  method: GET
  url: https://api.com/header
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://example.com/auth
    accessTokenUrl: https://example.com/token
    credentials:
      clientId: client-id
      clientSecret: client-secret
      placement: basic_auth_header
    pkce:
      disabled: true
    tokenConfig:
      placement:
        header: Bearer
      source: access_token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
