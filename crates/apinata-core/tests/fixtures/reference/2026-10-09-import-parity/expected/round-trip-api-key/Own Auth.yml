info:
  name: Own Auth
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/health
  auth:
    type: apikey
    key: client-id
    value: "{{client_id}}"
    placement: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
