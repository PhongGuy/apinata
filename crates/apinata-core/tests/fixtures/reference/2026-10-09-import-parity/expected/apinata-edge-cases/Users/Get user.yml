info:
  name: Get user
  type: http
  seq: 1

http:
  method: GET
  url: https://{{host}}/users/:id?expand=true&debug=1
  headers:
    - name: Accept
      value: application/json
      description: What we take
    - name: X-Off
      value: "1"
      disabled: true
  params:
    - name: expand
      value: "true"
      type: query
      description: Expand relations
    - name: debug
      value: "1"
      type: query
      disabled: true
    - name: id
      value: "42"
      type: path
      description: User id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Fetches one user
