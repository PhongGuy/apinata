info:
  name: Form
  type: http
  seq: 1

http:
  method: POST
  url: https://api.example.com:8443/form?q=x
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: X-Trace
      value: on
  params:
    - name: q
      value: x
      type: query
  body:
    type: form-urlencoded
    data:
      - name: a
        value: "1"
        description: First
      - name: b
        value: "2"
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
