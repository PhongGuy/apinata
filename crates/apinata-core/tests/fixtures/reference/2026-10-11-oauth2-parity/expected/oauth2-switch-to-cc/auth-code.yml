info:
  name: sign in
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/me
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.example.com/token
    refreshTokenUrl: https://id.example.com/refresh
    credentials:
      clientId: app
      clientSecret: "{{secret}}"
      placement: body
    scope: read write
    additionalParameters:
      accessTokenRequest:
        - name: audience
          placement: body
          value: https://api.example.com
      refreshTokenRequest:
        - name: X-Trace
          placement: header
          value: "1"
    tokenConfig:
      id: main
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
