info:
  name: service
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/jobs
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.example.com/token
    credentials:
      clientId: svc
      clientSecret: s3cret
      placement: body
    scope: jobs
    tokenConfig:
      id: svc
      placement:
        query: token
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
