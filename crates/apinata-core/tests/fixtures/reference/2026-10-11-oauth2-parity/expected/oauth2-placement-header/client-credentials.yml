info:
  name: service
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/jobs
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.example.com/token
    credentials:
      clientId: svc
      clientSecret: s3cret
      placement: basic_auth_header
    scope: jobs
    tokenConfig:
      id: svc
      placement:
        header: Token
      source: id_token
    settings:
      autoFetchToken: false
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
