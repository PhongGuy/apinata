info:
  name: service
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/jobs
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://id.example.com/authorize
    credentials:
      clientId: svc
    scope: jobs
    tokenConfig:
      id: svc
      placement:
        query: token
      source: id_token
    settings:
      autoFetchToken: false
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
