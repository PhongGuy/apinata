info:
  name: items
  type: http
  seq: 1

http:
  method: POST
  url: https://api.example.com/items
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.example.com/token
    credentials:
      clientId: svc
    tokenConfig:
      placement:
        header: ""
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
