info:
  name: sign in
  type: http
  seq: 1

http:
  method: GET
  url: https://api.example.com/me
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://id.example.com/authorize
    accessTokenUrl: https://id.example.com/token
    refreshTokenUrl: https://id.example.com/refresh
    callbackUrl: http://127.0.0.1:7777/callback
    credentials:
      clientId: app
      clientSecret: "{{secret}}"
      placement: body
    additionalParameters:
      authorizationRequest:
        - name: prompt
          placement: query
          value: consent
      accessTokenRequest:
        - name: audience
          placement: body
          value: https://api.example.com
      refreshTokenRequest:
        - name: X-Trace
          placement: header
          value: "1"
    scope: read write
    state: xyz
    pkce: {}
    tokenConfig:
      id: main
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
