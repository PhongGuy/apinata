info:
  name: list users
  type: graphql
  seq: 3

graphql:
  method: GET
  url: https://api.example.com/graphql?op=users
  params:
    - name: op
      value: users
      type: query
  body:
    query: "{ users { id } }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
