info:
  name: list users
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{host}}/graphql"
  headers:
    - name: x-a
      value: "1"
    - name: x-b
      value: "{{b}}"
      disabled: true
  body:
    query: "{ users { id } }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
