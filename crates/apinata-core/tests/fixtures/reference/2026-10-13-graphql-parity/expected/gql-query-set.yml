info:
  name: list users
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{host}}/graphql"
  body:
    query: |-
      query Users {
        users {
          id
          name
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
