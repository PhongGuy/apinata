info:
  name: Query key
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/keys"
  auth:
    type: apikey
    key: api_key
    value: "{{apiKey}}"
    placement: query
runtime:
  assertions:
    - expression: res.body
      operator: length
      value: "3"
    - expression: res.body[1]
      operator: eq
      value: "2"
