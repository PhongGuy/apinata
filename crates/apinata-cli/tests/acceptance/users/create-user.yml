info:
  name: Create user
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: '{"name": "{{newName}}", "id": {{userId}}}'
runtime:
  variables:
    - name: newName
      value: Bob
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.name
      operator: eq
      value: '"Bob"'
    - expression: res.body.id
      operator: eq
      value: "9"
    - expression: res.body.id
      operator: eq
      value: "${8}"
    - expression: res.url
      operator: isDefined
