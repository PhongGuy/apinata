[package]
name = "apinata-cli"
version.workspace = true
description = "The apinata command line: run OpenCollection requests and report assertion verdicts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# One integration binary: tests/main.rs declares every test file as a module.
autotests = false

[[bin]]
name = "apinata"
path = "src/main.rs"

[dependencies]
apinata-core = { path = "../apinata-core", default-features = false, features = ["keychain", "update"] }
apinata-mcp = { path = "../apinata-mcp" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
gethostname.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
url.workspace = true

[dev-dependencies]
socket2 = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["process", "time", "net", "io-util"] }
assert_cmd.workspace = true
base64.workspace = true
insta.workspace = true
minisign.workspace = true
predicates.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
wiremock.workspace = true
yaml_serde.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# A single test executable keeps the link count (and the target dir) small.
[[test]]
name = "integration"
path = "tests/main.rs"
