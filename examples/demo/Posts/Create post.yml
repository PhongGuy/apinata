info:
  name: Create post
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/posts"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Hello from Apinata",
        "body": "A demo post.",
        "userId": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
