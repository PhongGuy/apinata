info:
  name: Digest example
  type: http
  seq: 1

http:
  method: GET
  url: https://httpbin.org/digest-auth/auth/user/passwd
  auth:
    type: digest
    username: user
    password: passwd

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
