info:
  name: NTLM example
  type: http
  seq: 4

http:
  method: GET
  url: https://httpbin.org/get
  auth:
    type: ntlm
    username: demo
    password: demo-password
    domain: EXAMPLE

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
