info:
  name: List users
  type: http
  seq: 1
  tags:
    - smoke

http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
