opencollection: 1.0.0

info:
  name: Apinata Demo

request:
  variables:
    - name: baseUrl
      value: https://jsonplaceholder.typicode.com
    - name: postId
      value: "1"
    - name: userId
      value: "1"

docs:
  content: |-
    # Apinata Demo

    A small tour of Apinata.

    - **Posts** and **Users** call [JSONPlaceholder](https://jsonplaceholder.typicode.com), a free fake REST API.
    - **Media** calls [httpbin](https://httpbin.org) for responses that are not JSON.
    - **Auth** shows digest, NTLM, AWS Sig v4 signing and an OAuth 1.0 signature httpbin echoes.
    - **GraphQL** calls [GraphQLZero](https://graphqlzero.almansi.me), JSONPlaceholder's data over GraphQL.

    Media, Auth and GraphQL call other sites, so they are tagged `manual` and Run collection leaves them unticked; tick them to include them. The SigV4 example only shows signing, so its made-up address never answers.

    Sending a request needs network access.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
