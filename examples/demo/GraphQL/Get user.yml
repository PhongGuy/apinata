info:
  name: Get user
  type: graphql
  seq: 1

graphql:
  method: POST
  url: https://graphqlzero.almansi.me/api
  body:
    query: |-
      query ($id: ID!) {
        user(id: $id) {
          id
          name
          email
        }
      }
    variables: |-
      {
        "id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
