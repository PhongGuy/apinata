[workspace]
members = ["crates/apinata-core", "crates/apinata-cli", "crates/apinata-app", "crates/apinata-mcp", "crates/xtask"]
exclude = ["tools/apinata-pilot"]
resolver = "3"

[workspace.lints.clippy]
ref_option = "warn"
wildcard_imports = "warn"
clone_on_ref_ptr = "warn"
missing_assert_message = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
yaml_serde = "0.10.7"
saphyr-parser = "=0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
ryu-js = "1"
socket2 = "0.6"
thiserror = "2"
similar = "2.7"
regress = { version = "0.12", features = ["utf16"] }
markdown = "=1.0.0"
base64 = "0.23"
rpassword = "7"
serde_json_path = "=0.7.2"
uppsala = "=0.12.0"
url = "2"
percent-encoding = "2.3.2"
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "client-proxy", "client-proxy-system", "tokio"] }
tower = { version = "0.5.3", default-features = false }
http = "1"
http-body-util = "0.1"
# SHA-1 and 3DES open older openssl keys; export picks its scheme itself and never uses them.
pkcs8 = { version = "=0.11.0", features = ["encryption", "pem", "std", "sha1-insecure", "3des"] }
scrypt = { version = "=0.12.0", default-features = false }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
aws-lc-rs = "1.18"
tempfile = "3"
dirs = "7"
cookie_store = "=0.22.1"
publicsuffix = "=2.3.0"
time = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "query", "charset", "gzip", "deflate", "brotli", "zstd", "socks", "http2"] }
encoding_rs = "0.8"
mime = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "=0.7.20"
tokio-tungstenite = { version = "=0.30.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures", "parallel"] }
wiremock = "0.6.5"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
tokio-rustls = "0.26"
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.7"
anyhow = "1"
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
oas3 = "0.22"
predicates = "3"
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
gpui-kit = { version = "=0.9.1", features = ["tree-sitter", "tree-sitter-bash", "tree-sitter-csharp", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-markdown", "tree-sitter-php", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-graphql"] }
async-channel = "2.5.0"
# The kit links this grammar but ships no highlights query for it; the app registers one.
tree-sitter-c-sharp = "=0.23.5"
# The kit links this grammar with an empty highlights query; the app registers one.
tree-sitter-graphql = "=0.1.0"
# The kit has no PowerShell grammar; the app registers this one with its own highlights query.
tree-sitter-powershell = "=0.26.6"
# Parses GraphQL SDL schema files in core; error-tolerant, with byte offsets for positions.
apollo-parser = "=0.8.7"
# Validates GraphQL queries; exact, since a diagnostic filter matches its unstable_error_name.
apollo-compiler = "=1.33.1"
# Same version gpui-kit links, so its completion types are ours.
lsp-types = "=0.97.0"
# Exact: the seeded dynamic-variable sequence is part of core tests.
rand = { version = "=0.9.5", default-features = false, features = ["std", "std_rng", "os_rng"] }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "v1", "v3", "v4", "v5", "v6", "v7"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
gethostname = "1.1"
notify-debouncer-full = "=0.7.0"
# The platform trash: freedesktop, Windows and macOS. Exact, since restore on Linux and Windows
# finds the item again through its `os_limited` listing.
trash = "=5.2.9"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
minisign-verify = "=0.3.0"
semver = "1"
sha2 = "0.11"
aws-sigv4 = { version = "1.6", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"
md-5 = "0.11"
md4 = "0.11"
hmac = "0.13"
sha1 = "0.11"
rsa = { version = "0.9.10", features = ["sha1", "sha2", "getrandom", "hazmat"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
minisign = "=0.10.0"
self-replace = "=1.5.1"

# Dependencies build optimised in dev and test (the test profile inherits dev): GPUI's per-frame
# replay is the cost of a keystroke burst.
[profile.dev.package."*"]
opt-level = 1

# Each of the hundreds of test binaries links the whole UI stack, so full debug
# info multiplies into hundreds of gigabytes; tests build without it.
[profile.test]
debug = false

# Stripped, thin-LTO release binaries; no panic = "abort", since the app's actor relies on catch_unwind.
[profile.release]
strip = true
lto = "thin"
